<title>F&F Style Gate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* layout: fixed 1920x1080 stage scaled to fit; single committed look (cream stage on ink surround) */
:root{--ink:#14161c;--stage:#FBF7F0;--txt:#1a1a1a;--sub:#5b5750;--card:#ffffff;--disp:"Black Han Sans","Noto Sans KR",sans-serif;--body:"Noto Sans KR",-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);overflow:hidden;font-family:var(--body)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:var(--stage);transform-origin:center;flex:none;color:var(--txt)}
.scene{position:absolute;inset:0;clip-path:circle(0% at 72% 55%);transition:clip-path .8s cubic-bezier(.7,0,.2,1)}
.scene.on{clip-path:circle(150% at 72% 55%)}
#agent{position:absolute;top:48px;left:64px;z-index:50;display:flex;align-items:center;gap:14px;padding:14px 26px;border-radius:99px;background:rgba(255,255,255,.88);box-shadow:0 8px 30px rgba(0,0,0,.08);font-weight:700;font-size:24px;color:var(--txt)}
#agent .dot{width:14px;height:14px;border-radius:50%;background:#2ecc71;animation:pulse 1s infinite}
#agent .st{font-weight:500;color:var(--sub)}
#count{position:absolute;top:56px;right:72px;z-index:50;font-weight:900;font-size:26px;letter-spacing:.12em;color:var(--txt);opacity:.75;font-variant-numeric:tabular-nums}
#bar{position:absolute;left:0;bottom:0;height:8px;background:var(--txt);z-index:50;width:0}
.intro{background:var(--stage);display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{display:flex;font-family:var(--disp);font-size:330px;color:#151515;line-height:1}
.big span{display:inline-block;transform:translateY(-140%)}
.on .big span{animation:drop .9s cubic-bezier(.3,1.6,.5,1) forwards}
.sub{margin-top:24px;font-size:40px;font-weight:700;color:var(--sub);letter-spacing:.04em;opacity:0}
.on .sub{animation:fadeUp .6s 1s forwards}
.ask{margin-top:40px;padding:24px 40px;border-radius:30px 30px 30px 6px;background:var(--card);box-shadow:0 10px 40px rgba(0,0,0,.08);font-size:38px;font-weight:700;min-height:96px;opacity:0}
.on .ask{animation:pop .5s 1.5s forwards}
.peek{position:absolute;bottom:-30px;height:280px;opacity:0}
.on .peek{animation:peek .7s cubic-bezier(.3,1.6,.5,1) forwards}
.blob{position:absolute;width:900px;height:900px;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;right:120px;top:120px;transform:scale(0)}
.on .blob{animation:blobIn .8s .1s cubic-bezier(.3,1.5,.5,1) forwards,spin 12s 1s linear infinite}
.ring{position:absolute;right:260px;top:250px;width:620px;height:620px;border-radius:50%;border:6px dashed;opacity:0}
.on .ring{animation:fadeIn .4s .5s forwards,spin 20s linear infinite reverse}
.char{position:absolute;right:300px;bottom:110px;width:560px;height:700px;display:flex;align-items:flex-end;justify-content:center;transform:translateY(900px)}
.on .char{animation:charIn 1s .25s cubic-bezier(.2,.8,.3,1) forwards}
.char img{height:640px;width:auto;max-width:none;transform-origin:50% 100%}
.on .char img{animation:bob 1.4s 1.3s ease-in-out infinite}
.shadow{position:absolute;right:390px;bottom:88px;width:380px;height:44px;border-radius:50%;background:rgba(0,0,0,.14);filter:blur(6px);transform:scale(0)}
.on .shadow{animation:shIn .6s .9s forwards,shBob 1.4s 1.5s ease-in-out infinite}
.left{position:absolute;left:120px;top:210px;width:820px}
.tag{display:inline-block;padding:10px 22px;border-radius:99px;font-size:24px;font-weight:900;letter-spacing:.14em;color:#fff;opacity:0}
.on .tag{animation:pop .4s .3s forwards}
.brand{margin-top:22px;font-family:var(--disp);font-size:132px;line-height:.95;display:flex;flex-wrap:wrap}
.brand span{display:inline-block;opacity:0;transform:translateY(60px) rotate(8deg)}
.on .brand span{animation:letterUp .5s cubic-bezier(.3,1.6,.5,1) forwards}
.how{margin-top:28px;font-size:58px;font-weight:900;opacity:0;text-wrap:balance}
.on .how{animation:fadeUp .5s .9s forwards}
.card{margin-top:34px;padding:30px 36px;border-radius:28px;background:var(--card);box-shadow:0 14px 40px rgba(0,0,0,.08);font-size:36px;font-weight:500;color:#333;line-height:1.45;min-height:150px;opacity:0;transform:translateX(-60px)}
.on .card{animation:slideIn .5s 1.2s cubic-bezier(.3,1.4,.5,1) forwards}
.card b{display:block;font-size:22px;letter-spacing:.16em;margin-bottom:8px}
.caret{display:inline-block;width:3px;height:36px;background:#333;vertical-align:-6px;margin-left:4px;animation:blink .7s infinite}
.chips{margin-top:28px;display:flex;gap:14px;flex-wrap:wrap}
.chips span{padding:14px 26px;border-radius:99px;background:var(--card);font-size:28px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.06);opacity:0;transform:scale(.3)}
.on .chips span{animation:pop .45s cubic-bezier(.3,1.8,.5,1) forwards}
.spark{position:absolute;width:34px;height:34px;opacity:0}
.spark:before,.spark:after{content:"";position:absolute;left:50%;top:0;width:8px;height:100%;margin-left:-4px;border-radius:4px;background:currentColor}
.spark:after{transform:rotate(90deg)}
.on .spark{animation:twinkle 1.6s infinite}
.finale{background:var(--stage)}
.line{position:absolute;left:0;right:0;bottom:110px;display:flex;justify-content:center;align-items:flex-end;gap:10px}
.line img{height:400px;width:auto;max-width:none;transform:translateY(700px)}
.on .line img{animation:charIn .9s cubic-bezier(.2,.8,.3,1) forwards,bob2 1.2s ease-in-out infinite}
.head{position:absolute;top:160px;left:0;right:0;text-align:center}
.head h1{font-family:var(--disp);font-weight:400;font-size:110px;color:#151515;opacity:0}
.on .head h1{animation:pop .6s 1.6s cubic-bezier(.3,1.6,.5,1) forwards}
.head p{margin-top:18px;font-size:40px;font-weight:700;color:var(--sub);opacity:0}
.on .head p{animation:fadeUp .5s 2.2s forwards}
.logo{position:absolute;right:80px;bottom:40px;font-family:var(--disp);font-size:48px;opacity:0}
.on .logo{animation:fadeIn .5s 2.8s forwards}
#snd{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:99;padding:10px 18px;border-radius:99px;border:0;background:#fff;color:#14161c;font:700 15px var(--body);cursor:pointer;opacity:.85}
#gate{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;background:rgba(20,22,28,.55)}
#gate button{padding:18px 30px;border-radius:99px;border:0;background:#fff;color:#14161c;font:900 20px var(--body);cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#gate button:focus-visible,#snd:focus-visible{outline:3px solid #2ecc71}
#replay{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:99;padding:10px 18px;border-radius:99px;border:0;background:#fff;color:#14161c;font:700 15px var(--body);cursor:pointer;opacity:.8}
#replay:focus-visible{outline:3px solid #2ecc71}
@keyframes drop{to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@keyframes peek{0%{opacity:0;transform:translateY(300px)}100%{opacity:1;transform:translateY(0)}}
@keyframes blobIn{to{transform:scale(1)}}
@keyframes spin{from{rotate:0deg}to{rotate:360deg}}
@keyframes charIn{0%{transform:translateY(900px) scale(.7,1.3)}55%{transform:translateY(-50px) scale(1.06,.94)}72%{transform:translateY(0) scale(1.1,.9)}86%{transform:translateY(-10px) scale(.97,1.03)}100%{transform:translateY(0) scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}45%{transform:translateY(-34px) scale(.97,1.04) rotate(2deg)}90%{transform:translateY(0) scale(1.05,.95)}}
@keyframes bob2{0%,100%{translate:0 0}50%{translate:0 -22px}}
@keyframes shIn{to{transform:scale(1)}}
@keyframes shBob{0%,100%{transform:scale(1)}45%{transform:scale(.78)}}
@keyframes letterUp{to{opacity:1;transform:none}}
@keyframes slideIn{to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
<div id="wrap"><div id="stage">
  <div id="agent"><span class="dot"></span>F&amp;F Style Agent <span class="st" id="st">준비 중</span></div>
  <div id="count"></div>
  <div id="bar"></div>
  <section class="scene intro" id="s0">
    <div class="big"><span>F</span><span>&amp;</span><span>F</span></div>
    <div class="sub">5 BRANDS · 5 CHARACTERS · 옷 고르는 법</div>
    <div class="ask" data-type="오늘 뭐 입지? 브랜드별로 골라드릴게요"></div>
  </section>
  <section class="scene finale" id="s6">
    <div class="head"><h1>고민은 줄이고, 스타일은 확실하게</h1><p>F&amp;F 브랜드 캐릭터가 알려주는 옷 고르는 법</p></div>
    <div class="line"></div>
    <div class="logo">F&amp;F</div>
  </section>
</div></div>
<button id="replay" type="button">↻ 다시 보기</button>
<button id="snd" type="button">🔇 소리 켜기</button>

const stage=document.getElementById('stage'),fin=document.getElementById('s6');
B.forEach((b,i)=>{
  const s=document.createElement('section');s.className='scene';s.id='s'+(i+1);s.style.background=b.bg;
  const letters=[...b.name].map((c,j)=>`<span style="animation-delay:${.35+j*.05}s">${c===' '?'&nbsp;':c}</span>`).join('');
  const chips=b.tags.map((t,j)=>`<span style="color:${b.ac};animation-delay:${2.3+j*.15}s">${t}</span>`).join('');
  const sp=[[1080,180],[1700,260],[1150,820],[1760,760],[1500,120]].map(([x,y],j)=>`<i class="spark" style="left:${x}px;top:${y}px;color:${j%2?b.ac:'#fff'};animation-delay:${j*.3}s"></i>`).join('');
  s.innerHTML=`<div class="blob" style="background:${b.blob}"></div><div class="ring" style="border-color:${b.ac}33"></div>${sp}
   <div class="shadow"></div><div class="char"><img alt="" src="${IMG[b.img]}"></div>
   <div class="left"><span class="tag" style="background:${b.ac}">0${i+1} · ${b.cat}</span>
   <div class="brand" style="color:${b.ac}">${letters}</div><div class="how">${b.how}</div>
   <div class="card"><b style="color:${b.ac}">AGENT TIP</b><span class="tx" data-type="${b.tip}"></span></div>
   <div class="chips">${chips}</div></div>`;
  stage.insertBefore(s,fin);
});
fin.querySelector('.line').innerHTML=B.map((b,i)=>`<img alt="" src="${IMG[b.img]}" style="animation-delay:${.2+i*.18}s,${1.2+i*.12}s">`).join('');
const scenes=[...document.querySelectorAll('.scene')];
const T=[0,3.5,7.5,11.5,15.5,19.5,23.5],END=30;
const st=document.getElementById('st'),cnt=document.getElementById('count'),bar=document.getElementById('bar');
const status=['준비 중','스타일 분석 중…','스타일 분석 중…','스타일 분석 중…','스타일 분석 중…','스타일 분석 중…','추천 완료 ✓'];
let timers=[],raf,t0,soundOn=false;const au=document.getElementById('bgm'),snd=document.getElementById('snd');
function syncSnd(){snd.textContent=soundOn?'🔊 소리 끄기':'🔇 소리 켜기'}
function startAudio(){if(!soundOn)return;try{au.currentTime=0;const p=au.play();if(p&&p.catch)p.catch(()=>{soundOn=false;syncSnd()})}catch(e){}}
function type(el,delay){const s=el.dataset.type;el.textContent='';timers.push(setTimeout(()=>{let k=0;const c=document.createElement('i');c.className='caret';el.appendChild(c);const iv=setInterval(()=>{c.before(s[k++]);if(k>=s.length)clearInterval(iv)},38);timers.push(iv)},delay))}
function show(i){
  scenes[i].style.zIndex=10+i;scenes[i].classList.add('on');
  timers.push(setTimeout(()=>scenes.forEach((s,j)=>{if(j<i)s.classList.remove('on')}),900));
  st.textContent=status[i];cnt.textContent=(i>=1&&i<=5)?`0${i} / 05`:'';
  scenes[i].querySelectorAll('[data-type]').forEach(el=>type(el,el.classList.contains('ask')?1800:1500));
  if(i===0)scenes[0].insertAdjacentHTML('beforeend',B.map((b,j)=>`<img class="peek" alt="" src="${IMG[b.img]}" style="left:${150+j*350}px;animation-delay:${2.2+j*.12}s">`).join(''));
}
function play(){
  timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];cancelAnimationFrame(raf);
  scenes.forEach(s=>{s.classList.remove('on');s.style.zIndex=0});document.querySelectorAll('.peek').forEach(e=>e.remove());
  void stage.offsetWidth;
  startAudio();
  T.forEach((t,i)=>timers.push(setTimeout(()=>show(i),t*1000)));
  timers.push(setTimeout(play,END*1000));
  t0=performance.now();(function f(){bar.style.width=Math.min(100,(performance.now()-t0)/(END*10))+'%';raf=requestAnimationFrame(f)})();
}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
document.getElementById('replay').onclick=play;
snd.onclick=()=>{soundOn=!soundOn;syncSnd();if(soundOn)play();else au.pause()};
document.getElementById('go').onclick=()=>{document.getElementById('gate').hidden=true;soundOn=true;syncSnd();play()};addEventListener('keydown',e=>{if(e.key==='r')play()});
play();
